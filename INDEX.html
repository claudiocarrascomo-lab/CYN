<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYN Family</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #1d2671, #c33764);
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 5px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .box {
      padding: 15px;
      border-radius: 14px;
      color: white;
      font-weight: bold;
    }

    .ingresos { background: #00b894; }
    .gastos { background: #d63031; }
    .saldo { background: #0984e3; }
    .pendiente { background: #fdcb6e; color: #222; }

    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-red {
      background: #d63031;
    }

    .item {
      background: #f1f2f6;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .item.pagado {
      background: #d4edda;
      text-decoration: line-through;
      color: #2d6a4f;
    }

    .item button {
      width: auto;
      padding: 7px 10px;
      margin: 0;
      font-size: 13px;
      background: #ff7675;
    }

    .check {
      width: auto;
    }

    h2 {
      margin-top: 0;
      color: #2d3436;
    }

    footer {
      text-align: center;
      color: white;
      font-weight: bold;
      padding: 20px 0;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <h1>💰 CYN Family</h1>
      <p>Controla los ingresos y gastos de tu hogar</p>
    </div>

    <div class="card resumen">
      <div class="box ingresos">Ingresos<br>$<span id="totalIngresos">0</span></div>
      <div class="box gastos">Gastos<br>$<span id="totalGastos">0</span></div>
      <div class="box saldo">Saldo<br>$<span id="saldo">0</span></div>
      <div class="box pendiente">Pendiente<br>$<span id="pendiente">0</span></div>
    </div>

    <div class="card">
      <h2>Ingresos del mes</h2>
      <input id="nombreIngreso" placeholder="Ej: Sueldo, bono, extra">
      <input id="montoIngreso" type="number" placeholder="Monto">
      <button onclick="agregarIngreso()">Agregar ingreso</button>
      <div id="listaIngresos"></div>
    </div>

    <div class="card">
      <h2>Compromisos del mes</h2>
      <p>Marca cada gasto fijo cuando ya esté pagado.</p>
      <input id="nombreFijo" placeholder="Ej: Dividendo, luz, internet">
      <input id="montoFijo" type="number" placeholder="Monto">
      <button onclick="agregarGastoFijo()">Agregar gasto fijo</button>
      <div id="listaFijos"></div>
    </div>

    <div class="card">
      <h2>Gastos nuevos</h2>
      <input id="nombreVariable" placeholder="Ej: Supermercado, farmacia">
      <input id="montoVariable" type="number" placeholder="Monto">
      <button onclick="agregarGastoVariable()">Agregar gasto</button>
      <div id="listaVariables"></div>
    </div>

    <button class="btn-red" onclick="reiniciarMes()">Reiniciar mes</button>

    <footer>
      CYN Family v1.0<br>
      Desarrollado por Claudio Carrasco © 2026
    </footer>
  </div>

  <script>
    let ingresos = JSON.parse(localStorage.getItem("ingresos")) || [];
    let gastosFijos = JSON.parse(localStorage.getItem("gastosFijos")) || [];
    let gastosVariables = JSON.parse(localStorage.getItem("gastosVariables")) || [];

    function guardarDatos() {
      localStorage.setItem("ingresos", JSON.stringify(ingresos));
      localStorage.setItem("gastosFijos", JSON.stringify(gastosFijos));
      localStorage.setItem("gastosVariables", JSON.stringify(gastosVariables));
    }

    function formato(num) {
      return Number(num).toLocaleString("es-CL");
    }

    function agregarIngreso() {
      const nombre = document.getElementById("nombreIngreso").value;
      const monto = Number(document.getElementById("montoIngreso").value);

      if (!nombre || monto <= 0) {
        alert("Ingresa un nombre y monto válido.");
        return;
      }

      ingresos.push({ nombre, monto });
      document.getElementById("nombreIngreso").value = "";
      document.getElementById("montoIngreso").value = "";
      actualizar();
    }

    function agregarGastoFijo() {
      const nombre = document.getElementById("nombreFijo").value;
      const monto = Number(document.getElementById("montoFijo").value);

      if (!nombre || monto <= 0) {
        alert("Ingresa un nombre y monto válido.");
        return;
      }

      gastosFijos.push({ nombre, monto, pagado: false });
      document.getElementById("nombreFijo").value = "";
      document.getElementById("montoFijo").value = "";
      actualizar();
    }

    function agregarGastoVariable() {
      const nombre = document.getElementById("nombreVariable").value;
      const monto = Number(document.getElementById("montoVariable").value);

      if (!nombre || monto <= 0) {
        alert("Ingresa un nombre y monto válido.");
        return;
      }

      gastosVariables.push({ nombre, monto, pagado: true });
      document.getElementById("nombreVariable").value = "";
      document.getElementById("montoVariable").value = "";
      actualizar();
    }

    function eliminarIngreso(index) {
      ingresos.splice(index, 1);
      actualizar();
    }

    function eliminarFijo(index) {
      gastosFijos.splice(index, 1);
      actualizar();
    }

    function eliminarVariable(index) {
      gastosVariables.splice(index, 1);
      actualizar();
    }

    function cambiarPagado(index) {
      gastosFijos[index].pagado = !gastosFijos[index].pagado;
      actualizar();
    }

    function actualizar() {
      guardarDatos();

      const totalIngresos = ingresos.reduce((acc, item) => acc + item.monto, 0);
      const totalFijos = gastosFijos.reduce((acc, item) => acc + item.monto, 0);
      const totalVariables = gastosVariables.reduce((acc, item) => acc + item.monto, 0);
      const totalGastos = totalFijos + totalVariables;
      const pendiente = gastosFijos
        .filter(item => !item.pagado)
        .reduce((acc, item) => acc + item.monto, 0);

      const saldo = totalIngresos - totalGastos;

      document.getElementById("totalIngresos").innerText = formato(totalIngresos);
      document.getElementById("totalGastos").innerText = formato(totalGastos);
      document.getElementById("saldo").innerText = formato(saldo);
      document.getElementById("pendiente").innerText = formato(pendiente);

      document.getElementById("listaIngresos").innerHTML = ingresos.map((item, index) => `
        <div class="item">
          <span>${item.nombre}: $${formato(item.monto)}</span>
          <button onclick="eliminarIngreso(${index})">X</button>
        </div>
      `).join("");

      document.getElementById("listaFijos").innerHTML = gastosFijos.map((item, index) => `
        <div class="item ${item.pagado ? 'pagado' : ''}">
          <input class="check" type="checkbox" ${item.pagado ? "checked" : ""} onchange="cambiarPagado(${index})">
          <span>${item.nombre}: $${formato(item.monto)}</span>
          <button onclick="eliminarFijo(${index})">X</button>
        </div>
      `).join("");

      document.getElementById("listaVariables").innerHTML = gastosVariables.map((item, index) => `
        <div class="item">
          <span>${item.nombre}: $${formato(item.monto)}</span>
          <button onclick="eliminarVariable(${index})">X</button>
        </div>
      `).join("");
    }

    function reiniciarMes() {
      if (confirm("¿Seguro que quieres reiniciar el mes?")) {
        ingresos = [];
        gastosFijos = [];
        gastosVariables = [];
        actualizar();
      }
    }

    actualizar();
  </script>
</body>
</html>
